[project]
name = "neurotech-imagery"
version = "0.1.0"
description = "Auditable cross-subject motor imagery EEG classification"
requires-python = ">=3.11,<3.14"
dependencies = ["mne>=1.10,<1.14", "scikit-learn>=1.7,<1.9", "numpy>=2.2,<3", "scipy>=1.15,<2", "pandas>=2.2,<3", "matplotlib>=3.10,<4", "joblib>=1.4,<2"]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "edfio>=0.4,<0.5",
    "imageio-ffmpeg>=0.6,<0.7",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["neurotech"]
[tool.pytest.ini_options]
testpaths = ["tests"]
